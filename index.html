<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Công cụ mã hóa và giải mã cổ điển trên hệ Z26 và Z29 với Caesar, thay thế, Vigenere, Affine và Hill.">
  <title>Mã Hóa Cổ Điển - Công Cụ Mật Mã Z26 &amp; Z29</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon-a.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="game-themes.css">
  <link rel="stylesheet" href="minecraft-theme.css">
  <link rel="stylesheet" href="minecraft-font.css">
</head>
<body data-theme="phenikaa">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <img class="brand-logo-image" src="assets/logo-mahoa.svg" alt="MAHOA">
      </div>

      <nav class="side-nav">
        <button class="nav-item active" type="button">
          <span class="nav-icon">⌂</span>
          <span>Trang chủ</span>
        </button>

        <button class="nav-item" type="button">
          <span class="nav-icon">▣</span>
          <span>Mã hóa</span>
        </button>

        <button class="nav-item" type="button">
          <span class="nav-icon">A</span>
          <span>Bảng chữ cái</span>
        </button>

        <button class="nav-item" type="button">
          <span class="nav-icon">?</span>
          <span>Hướng dẫn</span>
        </button>

        <button class="nav-item" id="settingsButton" type="button">
          <span class="nav-icon">⚙</span>
          <span>Cài đặt</span>
        </button>
      </nav>

      <div class="side-footer">
        <span class="status-dot"></span>
        <span>Sẵn sàng</span>
      </div>
    </aside>

    <div class="page-area">
      <header class="topbar">
        <button class="menu-button" id="menuButton" type="button">☰</button>
        <div class="topbar-title">Mã Hóa Cổ Điển</div>

        <div class="topbar-search">
          <span>⌕</span>
          <input type="text" placeholder="Tìm kiếm chức năng..." aria-label="Tìm kiếm chức năng">
        </div>

        <div class="topbar-badge">Z26 / Z29</div>
      </header>

      <main class="content">
        <section class="breadcrumb">
          <span>Trang chủ</span>
          <b>›</b>
          <strong>Công cụ mã hóa</strong>
        </section>

        <section class="page-heading">
          <div>
            <p class="eyebrow">CRYPTOGRAPHY TOOL</p>
            <h1>Mã hóa và giải mã</h1>
          </div>
          <div class="heading-chip">5 thuật toán</div>
        </section>

        <section class="control-card">
          <div class="control-grid">
            <label class="field">
              <span>Loại mã hóa</span>
              <select id="cipherSelect">
                <option value="caesar">Dịch vòng</option>
                <option value="substitution">Mã thay thế</option>
                <option value="vigenere">Mã Vigenere</option>
                <option value="affine">Mã Affine</option>
                <option value="hill">Mã Hill</option>
              </select>
            </label>

            <label class="field">
              <span>Hệ chữ cái</span>
              <select id="alphabetSelect">
                <option value="z26">Z26 · Tiếng Anh</option>
                <option value="z29">Z29 · Tiếng Việt</option>
              </select>
            </label>

            <div class="field key-area">
              <span>Khóa / Tham số</span>
              <div id="keyControls"></div>
            </div>
          </div>

          <div class="alphabet-strip">
            <span class="alphabet-label">Bảng chữ cái</span>
            <div id="alphabetPreview" class="alphabet-preview"></div>
          </div>
        </section>

        <section class="workspace-card">
          <div class="text-panel">
            <div class="panel-heading">
              <div>
                <span class="panel-icon">T</span>
                <strong>Bản rõ</strong>
              </div>
              <span id="plainCount">0 ký tự</span>
            </div>
            <textarea id="plainText" placeholder="Nhập bản rõ tại đây..."></textarea>
          </div>

          <div class="actions">
            <button id="encryptButton" class="action-button primary" type="button">
              <span>→</span>
              Mã hóa
            </button>

            <button id="decryptButton" class="action-button secondary" type="button">
              <span>←</span>
              Giải mã
            </button>

            <button id="swapButton" class="action-button outline" type="button">
              <span>⇄</span>
              Đổi chỗ
            </button>

            <button id="clearButton" class="action-button ghost" type="button">
              <span>↻</span>
              Xóa
            </button>
          </div>

          <div class="text-panel">
            <div class="panel-heading">
              <div>
                <span class="panel-icon lock">C</span>
                <strong>Bản mã</strong>
              </div>
              <span id="cipherCount">0 ký tự</span>
            </div>
            <textarea id="cipherText" placeholder="Nhập hoặc nhận bản mã tại đây..."></textarea>
          </div>
        </section>

        <section class="bottom-row">
          <div class="mini-card algorithm-card">
            <div class="mini-card-title">
              <span class="mini-icon">◆</span>
              <strong>Thuật toán đang chọn</strong>
            </div>
            <div class="algorithm-current">
              <span id="algorithmName">Dịch vòng</span>
              <small id="algorithmMode">Z26</small>
            </div>
          </div>

          <div class="mini-card quick-card">
            <div class="mini-card-title">
              <span class="mini-icon yellow">✓</span>
              <strong>Trạng thái</strong>
            </div>
            <div id="message" class="message">Sẵn sàng xử lý dữ liệu.</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <div>
          <span class="settings-kicker">CÀI ĐẶT</span>
          <h2 id="settingsTitle">Theme giao diện</h2>
        </div>
        <button class="settings-close" id="settingsClose" type="button" aria-label="Đóng">×</button>
      </div>

      <div class="theme-list">
        <button class="theme-option active" type="button" data-theme-option="phenikaa">
          <span class="theme-preview theme-preview-blue"></span>
          <span class="theme-copy">
            <strong>Phenikaa</strong>
            <small>Xanh dương · Trắng · Vàng</small>
          </span>
          <span class="theme-check">✓</span>
        </button>

        <button class="theme-option" type="button" data-theme-option="youtube">
          <span class="theme-preview theme-preview-red"></span>
          <span class="theme-copy">
            <strong>YouTube</strong>
            <small>Đỏ · Trắng · Đen</small>
          </span>
          <span class="theme-check">✓</span>
        </button>

        <button class="theme-option" type="button" data-theme-option="shopee">
          <span class="theme-preview theme-preview-orange"></span>
          <span class="theme-copy">
            <strong>Shopee</strong>
            <small>Cam · Trắng · Xám nhạt</small>
          </span>
          <span class="theme-check">✓</span>
        </button>

        <button class="theme-option" type="button" data-theme-option="tiktok">
          <span class="theme-preview theme-preview-pink"></span>
          <span class="theme-copy">
            <strong>TikTok</strong>
            <small>Đen · Hồng · Trắng</small>
          </span>
          <span class="theme-check">✓</span>
        </button>

        <button class="theme-option" type="button" data-theme-option="ben10">
          <span class="theme-preview theme-preview-green"></span>
          <span class="theme-copy">
            <strong>Ben 10</strong>
            <small>Xanh lá · Đen · Trắng</small>
          </span>
          <span class="theme-check">✓</span>
        </button>

        <button class="theme-option" type="button" data-theme-option="steam">
          <span class="theme-preview theme-preview-steam"></span>
          <span class="theme-copy">
            <strong>Steam</strong>
            <small>Xanh navy · Xanh cyan · Đen</small>
          </span>
          <span class="theme-check">✓</span>
        </button>

        <button class="theme-option" type="button" data-theme-option="discord">
          <span class="theme-preview theme-preview-discord"></span>
          <span class="theme-copy">
            <strong>Discord</strong>
            <small>Tím indigo · Đen · Trắng</small>
          </span>
          <span class="theme-check">✓</span>
        </button>

        <button class="theme-option" type="button" data-theme-option="valorant">
          <span class="theme-preview theme-preview-valorant"></span>
          <span class="theme-copy">
            <strong>Valorant</strong>
            <small>Đỏ Valorant · Navy · Trắng ngà</small>
          </span>
          <span class="theme-check">✓</span>
        </button>

        <button class="theme-option" type="button" data-theme-option="lol">
          <span class="theme-preview theme-preview-lol"></span>
          <span class="theme-copy">
            <strong>League of Legends</strong>
            <small>Xanh teal · Vàng kim · Đen</small>
          </span>
          <span class="theme-check">✓</span>
        </button>

        <button class="theme-option" type="button" data-theme-option="minecraft">
          <span class="theme-preview theme-preview-minecraft"></span>
          <span class="theme-copy">
            <strong>Minecraft</strong>
            <small>Đất pixel · Xám · Xanh cỏ</small>
          </span>
          <span class="theme-check">✓</span>
        </button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
  <script src="theme.js"></script>
</body>
</html>
